<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="markBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080D1A"/>
      <stop offset="50%" stop-color="#0E162B"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>

    <linearGradient id="markRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="35%" stop-color="#6366F1"/>
      <stop offset="70%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>

    <linearGradient id="markPrimary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="50%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#C026D3"/>
    </linearGradient>

    <linearGradient id="markAccent" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>

    <linearGradient id="markBolt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#EF4444"/>
    </linearGradient>

    <filter id="markGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="16" y="16" width="480" height="480" rx="112" ry="112" fill="url(#markBg)"/>
  <rect x="16" y="16" width="480" height="480" rx="112" ry="112" fill="none" stroke="url(#markRim)" stroke-width="3.5" opacity="0.9"/>

  <!-- Ambient Glow -->
  <circle cx="256" cy="256" r="170" fill="#6366F1" opacity="0.2" filter="url(#markGlow)"/>

  <!-- Handle -->
  <path d="M 195 160 C 195 110, 317 110, 317 160" 
        fill="none" 
        stroke="url(#markAccent)" 
        stroke-width="24" 
        stroke-linecap="round"/>

  <!-- Bag / B Base -->
  <path d="M 165 160 L 335 160 C 350 160, 362 172, 360 187 L 340 365 C 337 382, 322 395, 305 395 L 185 395 C 167 395, 152 382, 150 365 L 140 187 C 137 172, 150 160, 165 160 Z" 
        fill="url(#markPrimary)"/>

  <!-- Cutouts -->
  <rect x="215" y="210" width="70" height="45" rx="18" fill="#090E1A"/>
  <rect x="215" y="290" width="80" height="55" rx="20" fill="#090E1A"/>

  <!-- Bolt -->
  <polygon points="280,125 215,245 265,245 220,365 335,225 270,225 315,125" 
           fill="url(#markBolt)" 
           filter="url(#markGlow)"/>

  <!-- Sparkles -->
  <g transform="translate(385, 105) scale(0.6)">
    <path d="M 0,-40 Q 0,0 40,0 Q 0,0 0,40 Q 0,0 -40,0 Q 0,0 0,-40 Z" fill="#38BDF8"/>
    <circle cx="0" cy="0" r="8" fill="#FFFFFF"/>
  </g>
  <g transform="translate(115, 405) scale(0.4)">
    <path d="M 0,-40 Q 0,0 40,0 Q 0,0 0,40 Q 0,0 -40,0 Q 0,0 0,-40 Z" fill="#EC4899"/>
  </g>
</svg>
