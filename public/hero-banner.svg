<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 600" width="1920" height="600">
  <defs>
    <linearGradient id="heroBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811"/>
      <stop offset="50%" stop-color="#0E162B"/>
      <stop offset="100%" stop-color="#070B14"/>
    </linearGradient>

    <radialGradient id="heroGlow1" cx="30%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="heroGlow2" cx="75%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="heroBrand" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="40%" stop-color="#818CF8"/>
      <stop offset="80%" stop-color="#C084FC"/>
      <stop offset="100%" stop-color="#F43F5E"/>
    </linearGradient>

    <linearGradient id="heroBolt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1920" height="600" fill="url(#heroBg)"/>
  <circle cx="500" cy="300" r="600" fill="url(#heroGlow1)"/>
  <circle cx="1450" cy="300" r="550" fill="url(#heroGlow2)"/>

  <!-- Cyber Grid -->
  <g stroke="#334155" stroke-width="0.75" opacity="0.15">
    <line x1="0" y1="120" x2="1920" y2="120"/>
    <line x1="0" y1="240" x2="1920" y2="240"/>
    <line x1="0" y1="360" x2="1920" y2="360"/>
    <line x1="0" y1="480" x2="1920" y2="480"/>
    <line x1="240" y1="0" x2="240" y2="600"/>
    <line x1="480" y1="0" x2="480" y2="600"/>
    <line x1="720" y1="0" x2="720" y2="600"/>
    <line x1="960" y1="0" x2="960" y2="600"/>
    <line x1="1200" y1="0" x2="1200" y2="600"/>
    <line x1="1440" y1="0" x2="1440" y2="600"/>
    <line x1="1680" y1="0" x2="1680" y2="600"/>
  </g>

  <!-- Center Content -->
  <g transform="translate(960, 290)" text-anchor="middle">
    <!-- Icon Mark Floating Center Top -->
    <g transform="translate(0, -170)">
      <rect x="-45" y="-45" width="90" height="90" rx="24" fill="#0F172A" stroke="url(#heroBrand)" stroke-width="3"/>
      <path d="M -16 -12 C -16 -24, 16 -24, 16 -12" fill="none" stroke="#38BDF8" stroke-width="4" stroke-linecap="round"/>
      <path d="M -24 -12 L 24 -12 L 20 28 L -20 28 Z" fill="url(#heroBrand)"/>
      <polygon points="5,-20 -8,4 0,4 -6,22 14,0 4,0 10,-20" fill="url(#heroBolt)"/>
      <circle cx="28" cy="-28" r="4" fill="#38BDF8"/>
    </g>

    <!-- Main Title -->
    <text y="-25" font-family="system-ui, -apple-system, sans-serif" font-size="82" font-weight="900" letter-spacing="-2px" fill="#FFFFFF">
      BECHO <tspan fill="#A855F7" font-size="54">বেচো</tspan>
    </text>

    <!-- Tagline Highlight -->
    <text y="45" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="800" letter-spacing="1px" fill="url(#heroBrand)">
      AUTONOMOUS AI SOCIAL SALES &amp; SUPPORT CLOSER
    </text>

    <!-- Description -->
    <text y="95" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="400" fill="#94A3B8">
      Understands customer photos, uses high-converting marketing psychology, and books Cash-on-Delivery orders in 2 seconds.
    </text>

    <!-- Stat Badges Row -->
    <g transform="translate(0, 150)">
      <!-- Badge 1 -->
      <g transform="translate(-320, 0)">
        <rect x="-110" y="-18" width="220" height="42" rx="21" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
        <text y="8" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#38BDF8">⚡ 2-Second Closers</text>
      </g>
      <!-- Badge 2 -->
      <g transform="translate(0, 0)">
        <rect x="-125" y="-18" width="250" height="42" rx="21" fill="#1E293B" stroke="#10B981" stroke-width="1.5"/>
        <text y="8" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#34D399">📦 Automated COD Dispatch</text>
      </g>
      <!-- Badge 3 -->
      <g transform="translate(320, 0)">
        <rect x="-110" y="-18" width="220" height="42" rx="21" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
        <text y="8" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#F43F5E">🧠 Marketing Psychology</text>
      </g>
    </g>
  </g>
</svg>
